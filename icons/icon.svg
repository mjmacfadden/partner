<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="partnerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="partnerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#partnerGrad)"/>
  
  <!-- Network / Pair Nodes Graphic -->
  <g filter="url(#partnerShadow)" fill="white">
    <!-- Center connecting line / bridge -->
    <path d="M190 256 Q 256 220 322 256" stroke="white" stroke-width="20" stroke-linecap="round" fill="none" opacity="0.9"/>
    
    <!-- Left person -->
    <circle cx="170" cy="190" r="44"/>
    <path d="M106 320 C 106 270, 234 270, 234 320 C 234 330, 106 330, 106 320 Z"/>

    <!-- Right person -->
    <circle cx="342" cy="190" r="44"/>
    <path d="M278 320 C 278 270, 406 270, 406 320 C 406 330, 278 330, 278 320 Z"/>

    <!-- Sparkle / Sync Star -->
    <path d="M256 120 L262 138 L280 144 L262 150 L256 168 L250 150 L232 144 L250 138 Z" fill="#fef08a"/>
  </g>
</svg>
